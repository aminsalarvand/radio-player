<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    >
    <title>Lahze</title>
    <meta
        name="description"
        content="Lahze — Online Radio Player"
    >
    <meta name="theme-color" content="#0b0e13">
    <link rel="icon" type="image/png" href="img/cover.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap"
        rel="stylesheet"
    >
    <link rel="stylesheet" href="css/font-awesome.min.css">
    <link rel="stylesheet" href="css/animate.css">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/ai.css">

<body>

    <div class="bg" aria-hidden="true">

    </div>

    <button type="button" id="installPwaBtn" class="install-btn" hidden>

    <main class="app">

        <header class="masthead">

        <section class="radio-stations">

            </button>

            <button type="button" class="radio-station" onclick="switchRadio(1)">

                <span class="radio-live-dot"></span>
            </button>

            <button type="button" class="radio-station" onclick="switchRadio(2)">
                <span class="radio-icon">
                    <i class="fa fa-music"></i>
                </span>
                <span class="radio-station-info">
                    <strong>Radio Shadi</strong>

        </section>

        <section class="player">
<!-- AI mood analyzer -->
<div class="artwork cover-album ai-player-box">
    <div class="ai-player-content">

        <div class="ai-icon">
            <i class="fa fa-magic"></i>
        </div>

        <h2>How are you feeling?</h2>

        <p>Tell AI how you feel and get a personalized radio experience.</p>

        <textarea
            id="moodText"
            placeholder="e.g. I'm feeling sad and want something relaxing..."
        ></textarea>

        <button id="moodButton" type="button" onclick="detectAI()">
            <i class="fa fa-magic"></i>
            Analyze My Mood

        <div id="moodResult"></div>

    </div>
</div>

            <div class="player-info">
                <span class="live-badge"><span class="live-dot"></span>LIVE</span>
                <h1 id="currentSong" class="text-uppercase loading-text">
                    Tune<br>
                    In
                </h1>
                <h2 id="currentArtist" class="text-capitalize" style="visibility: hidden;"></h2>

                <div class="controls">
                    <div class="control-cluster">
                        <div class="volume-wrap volume-control">
                            <button type="button" class="ctrl-btn volume-toggle" aria-label="Volume" title="Volume">
                                <i class="fa fa-volume-up"></i>
                            </button>
                            <div class="volume-popover" hidden>
                                <input type="range" id="volume" step="1" min="0" max="100" value="80" aria-label="Volume">
                                <span class="vol-value"><span id="volIndicator">80</span>%</span>
                            </div>
                        </div>

                        <button type="button" class="play-btn" onclick="togglePlay()" aria-label="Play or Pause">
                            <i id="playerButton" class="fa fa-play"></i>
                        </button>

                        <button type="button" class="ctrl-btn lyrics" title="Lyrics" aria-label="Lyrics">
                            <i class="fa fa-music"></i>
                        </button>

                        <button type="button" class="ctrl-btn clip-toggle" title="Music Video" aria-label="Music Video" hidden>
                            <i class="fa fa-youtube-play"></i>
                        </button>
                    </div>
                    <span id="buttonPlay" class="sr-only" aria-live="polite">PLAY</span>
                </div>
            </div>
        </section>

        <section class="historic">
            <h2 class="section-title">Recently Played</h2>
            <div class="history-list" id="historicSong">
                <article>
                    <div class="cover-historic"></div>
                    <div class="music-info">
                        <div class="song">Music</div>
                        <div class="artist">Artist</div>
                    </div>
                </article>
                <article>
                    <div class="cover-historic"></div>
                    <div class="music-info">
                        <div class="song">Music</div>
                        <div class="artist">Artist</div>
                    </div>
                </article>
            </div>
        </section>

        <section class="historic">
            <h2 class="section-title">Recently Saved</h2>

            <div class="history-list" id="savedSong">
                <article>
                    <div class="cover-historic"></div>
                    <div class="music-info">
                        <div class="song">Music</div>
                        <div class="artist">Artist</div>
                    </div>
                </article>

                <article>
                    <div class="cover-historic"></div>
                    <div class="music-info">
                        <div class="song">Music</div>
                        <div class="artist">Artist</div>
                    </div>
                </article>
            </div>
        </section>

        <footer class="partner">
            <a href="https://www.radios.com.br/aovivo/jalson-web-radio/290164" target="_blank" rel="noopener">
                <img src="img/radiosnet.png" alt="Ouça nossa rádio com RadiosNet — baixe agora o app" width="234" height="60">
            </a>
        </footer>
    </main>

    <div id="modalLyrics" role="dialog" aria-modal="true" aria-labelledby="lyricsSong" aria-hidden="true">
        <div class="modal-card">
            <header>
                <h3 id="lyricsSong">Letra</h3>
                <button type="button" class="modal-close" aria-label="Fechar">
                    <i class="fa fa-times"></i>
                </button>
            </header>
            <div id="lyric"></div>
        </div>
    </div>

    <script type="text/javascript" src="config.js"></script>
    <script type="text/javascript" src="js/script.js"></script>
    <script>
        // Modal de letra (o script sinaliza que há letra disponível
        // colocando data-toggle no botão .lyrics)
        (function () {
            var modal = document.getElementById('modalLyrics');
            var openButton = document.querySelector('.lyrics');

            function closeModal() {
                modal.style.display = 'none';
                modal.setAttribute('aria-hidden', 'true');
                document.body.classList.remove('modal-open');
            }

            openButton.addEventListener('click', function (event) {
                event.preventDefault();
                if (!openButton.hasAttribute('data-toggle')) return; // sem letra disponível
                modal.style.display = 'flex';
                modal.setAttribute('aria-hidden', 'false');
                document.body.classList.add('modal-open');
            });

            modal.addEventListener('click', function (event) {
                if (event.target === modal) closeModal();
            });
            modal.querySelector('.modal-close').addEventListener('click', closeModal);
            document.addEventListener('keydown', function (event) {
                if (event.key === 'Escape') closeModal();
            });
        })();

        // Popover de volume (abre no clique do botão circular, fecha ao clicar fora)
        (function () {
            var wrap = document.querySelector('.volume-wrap');
            var toggle = document.querySelector('.volume-toggle');
            var popover = document.querySelector('.volume-popover');
            if (!wrap || !toggle || !popover) return;

            toggle.addEventListener('click', function () {
                popover.hidden = !popover.hidden;
            });
            document.addEventListener('click', function (event) {
                if (!wrap.contains(event.target)) popover.hidden = true;
            });
        })();

        if ('serviceWorker' in navigator) {
            window.addEventListener('load', function () {
                navigator.serviceWorker.register('service-worker.js');
            });
        }
    </script>

</body>

</html>
